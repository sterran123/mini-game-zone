<!doctype html>
<!-- OG 커버 이미지 제작용 — 1200x630으로 캡처해 assets/og-cover.png로 저장 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden;
    background: radial-gradient(1100px 720px at 50% -10%, #2A2140 0%, #17141F 45%, #0E0B14 100%);
    font-family: 'Pretendard Variable', sans-serif; color: #F4EFFA; }
  .scene { position: relative; width: 1200px; height: 630px; }
  .star { position: absolute; background: #fff; border-radius: 50%; }
  .sprite { position: absolute; image-rendering: pixelated; }
  /* 중앙 텍스트는 정확히 가운데 — 스프라이트는 네 모서리에만 배치 */
  .copy { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -52%);
    display: flex; flex-direction: column; align-items: center; text-align: center; }
  .zone { font-family: 'Press Start 2P', monospace; font-size: 54px; color: #FFD166;
    letter-spacing: 2px; white-space: nowrap;
    text-shadow: 6px 6px 0 rgba(0,0,0,.55), 0 0 55px rgba(255,209,102,.4); }
  .zone em { color: #5CE0B3; font-style: normal; }
  .desc { font-size: 29px; font-weight: 700; color: #B9B1CE; margin-top: 34px; line-height: 1.5; }
  .desc b { color: #F4EFFA; }
  .badges { display: flex; gap: 14px; margin-top: 44px; }
  .badge { background: rgba(139,124,255,.16); border: 1px solid rgba(139,124,255,.45);
    border-radius: 999px; padding: 10px 26px; font-size: 23px; font-weight: 700; color: #CDC3F5; }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="copy">
    <p class="zone">MINI GAME <em>ZONE</em></p>
    <p class="desc"><b>김민기</b>가 직접 만든 브라우저 미니게임 모음.<br>로켓으로 운석을 피하고, 블록을 쌓아 지워라.</p>
    <div class="badges">
      <span class="badge">🚀 메테오 런</span><span class="badge">🧱 테트리스</span><span class="badge">픽셀 아트</span>
    </div>
  </div>
</div>
<script>
  const scene = document.getElementById('scene');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('span');
    const sz = 2 + Math.random() * 3;
    Object.assign(s.style, { left: Math.random()*1200+'px', top: Math.random()*630+'px',
      width: sz+'px', height: sz+'px', opacity: .15 + Math.random()*.55 });
    s.className = 'star'; scene.appendChild(s);
  }
  const put = (n, x, y, size, rot=0, alpha=1) => {
    const img = document.createElement('img');
    img.src = '../assets/sprites/' + n + '.svg'; img.className = 'sprite';
    Object.assign(img.style, { left: x+'px', top: y+'px', width: size+'px', height: 'auto',
      transform: `rotate(${rot}deg)`, opacity: alpha });
    scene.appendChild(img);
  };
  // 네 모서리 대칭 배치 — 가운데 텍스트 영역은 비움
  // 왼쪽: 메테오 런 세트
  put('meteor', 45, 40, 86, 25);
  put('boss',   128, 96, 96, 0, .95);
  put('rocket', 70, 400, 145, -32);
  put('star',   210, 300, 42);
  put('star',   40, 250, 32, 0, .8);
  // 오른쪽: 테트리스 세트 — 가장자리까지 펼침
  put('tetris', 1030, 45, 140, 14);
  put('tetris', 935, 420, 120, -12, .95);
  put('meteor', 1095, 300, 70, -18, .85);
  put('meteor', 955, 235, 60, 30, .7);
  put('star',   1120, 155, 36);
  // 상하 가장자리 구름·별
  put('cloud', 380, 25, 140, 0, .28);
  put('cloud', 690, 540, 170, 0, .25);
  put('star',   585, 40, 30, 0, .75);
  put('star',   720, 560, 28, 0, .75);
</script>
</body>
</html>
